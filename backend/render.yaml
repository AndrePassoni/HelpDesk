services:
  - type: web
    name: helpdesk-api
    env: node
    rootDir: backend
    region: ohio
    plan: free
    buildCommand: "npm install && npx prisma generate && npm run build && npx prisma migrate deploy && npx tsx prisma/seed.ts"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3333
